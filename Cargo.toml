[workspace]
members = [
    "crates/scanner-core",
    "crates/scanner-app",
    "crates/scanner-cli",
]
default-members = ["crates/scanner-app"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"
rust-version = "1.96"

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
dirs = "6.0.0"
eframe = "0.36.1"
egui = "0.36.1"
image = { version = "0.25.10", default-features = false, features = [
    "bmp",
    "jpeg",
    "png",
    "tiff",
] }
opencv = { version = "0.100.1", default-features = false, features = [
    "clang-runtime",
    "imgcodecs",
    "imgproc",
] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
sys-locale = "0.3.2"
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
uuid = { version = "1.26.0", features = ["serde", "v4"] }

scanner-core = { path = "crates/scanner-core" }
